# macOS build (second target). Windows remains the primary pipeline (windows.yml).
name: macos

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Engine tests
        run: |
          set +e
          cargo test --workspace --exclude k92-desktop 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Show failures as annotations so they are readable without opening the log.
            grep -E "panicked|FAILED|failed|assert|error" test.log | head -40 | while IFS= read -r l; do
              echo "::error title=test failure::$l"
            done
          fi
          exit $code

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build app and dmg (unsigned)
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: k92-macos-dmg
          path: target/release/bundle/dmg/*.dmg
