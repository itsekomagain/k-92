[package]
name = "k92-desktop"
description = "K-92 desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
name = "k92_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
k92-backup = { version = "0.1.0", path = "../../../crates/k92-backup" }
k92-core = { version = "0.1.0", path = "../../../crates/k92-core" }
k92-repository = { version = "0.1.0", path = "../../../crates/k92-repository" }
k92-restore = { version = "0.1.0", path = "../../../crates/k92-restore" }
k92-windows = { version = "0.1.0", path = "../../../crates/k92-windows" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2"
tauri-plugin-dialog = "2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[build-dependencies]
tauri-build = "2"
