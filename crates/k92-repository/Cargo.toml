[package]
name = "k92-repository"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8.7"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
k92-core = { version = "0.1.0", path = "../k92-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
thiserror = "2.0.21"
tracing = "0.1.44"
uuid = { version = "1.29.2", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"

[features]
# Pure-Rust BLAKE3 (no C/asm). Only for cross-checking from non-Windows hosts; releases use SIMD.
pure-hash = ["blake3/pure"]
