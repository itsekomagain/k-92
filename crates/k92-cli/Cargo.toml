[package]
name = "k92-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
k92-backup = { version = "0.1.0", path = "../k92-backup" }
k92-core = { version = "0.1.0", path = "../k92-core" }
k92-repository = { version = "0.1.0", path = "../k92-repository" }
k92-restore = { version = "0.1.0", path = "../k92-restore" }
serde = "1.0.229"
serde_json = "1.0.154"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[[bin]]
name = "k92"
path = "src/main.rs"
